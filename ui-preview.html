<!doctype html><html><head><meta charset="utf-8"><style>*{box-sizing:border-box}body{margin:0;background:#141419;color:#f6f4f1;font-family:Segoe UI,Arial,sans-serif}.app{width:1024px;height:640px;background:radial-gradient(circle at 85% 20%,#3c1c17 0,transparent 36%),#141419}.top{height:55px;border-bottom:1px solid #332823;background:#16171d;display:flex;align-items:center;padding:0 16px}.mark{font-size:28px;font-weight:900;color:#ff6923}.brand{font-weight:800;margin-left:9px}.edition{margin-left:16px;font-size:11px;color:#ff6923;letter-spacing:2px}.side{position:absolute;top:55px;width:76px;height:585px;background:#181a21;border-right:1px solid #292b35;padding:27px 8px}.nav{height:54px;margin-bottom:12px;border:1px solid #393c49;border-radius:9px;display:grid;place-items:center;color:#9d999e;font-size:11px;font-weight:800}.nav.active{background:linear-gradient(145deg,#59261f,#341b1c);border-color:#cf4b2e;color:#ff8a4b;box-shadow:inset 3px 0 #ff6923}.main{margin-left:76px;padding:30px 28px}.title{font-size:29px;font-weight:900;margin:0}.accent{color:#ff6923}.sub{color:#979194;font-size:14px;margin-top:6px}.line{height:2px;background:linear-gradient(90deg,#ff6923,#802c27,transparent);margin:20px 0 28px}.master{height:64px;background:#0e0f15;border:1px solid #39241f;border-radius:10px;padding:14px 16px;display:flex;align-items:center;width:548px}.master b{font-size:16px}.master small{display:block;color:#979194;margin-top:3px}.toggle{margin-left:auto;width:47px;height:25px;border-radius:20px;background:linear-gradient(90deg,#ff6923,#e53730);padding:3px}.knob{width:19px;height:19px;background:white;border-radius:50%;margin-left:22px}.panel{width:548px;height:220px;margin-top:16px;border-radius:11px;background:#121318;border:1px solid #2c2525;overflow:hidden}.tabs{height:48px;background:#0c0d12;display:flex;align-items:end}.tab{width:33%;text-align:center;color:#8d8990;font-size:11px;font-weight:800;padding:15px 0;border-bottom:2px solid transparent}.tab.active{color:#ff8a4b;border-color:#ff6923}.status{padding:24px 20px;color:#a9a4a6;font-size:13px}.status b{color:#ff8a4b}.screen{height:92px;margin-top:16px;background:repeating-linear-gradient(0deg,#08090d,#08090d 2px,#0b0c11 3px);border:1px solid #24232a;border-radius:8px;display:grid;place-items:center;color:#66636b}.stop{position:absolute;left:104px;bottom:24px;color:#8f8b91;font-size:13px}</style></head><body><div class="app"><div class="top"><span class="mark">S</span><span class="brand">SNEWSWARE</span><span class="edition">EMBER</span></div><div class="side"><div class="nav">KITS</div><div class="nav">CHEST</div><div class="nav active">FISHER</div><div class="nav">SOCD</div></div><main class="main"><h1 class="title">Fisher <span class="accent">Automation</span></h1><div class="sub">Detect and control the fishing minigame.</div><div class="line"></div><div class="master"><div><b>Fishing Macro</b><small>Master enable / disable</small></div><div class="toggle"><div class="knob"></div></div></div><div class="panel"><div class="tabs"><div class="tab active">TRACKER</div><div class="tab">CONTROL</div><div class="tab">STATUS</div></div><div class="status"><b>● WATCHING EVERY 0.5 s</b><div class="screen">Fishing detection view</div></div></div><div class="stop">CTRL + Q &nbsp; Emergency stop</div></main></div></body></html>
